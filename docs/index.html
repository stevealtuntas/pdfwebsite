<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sitivle · Rehberler</title>
<style>
:root{--g:#00e676;--bg:#0a0a0f;--card:#15151f;--muted:#8a8a9a}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:
radial-gradient(1200px 600px at 50% -10%,#12241a 0%,var(--bg) 60%);color:#f0f0f5;
margin:0;padding:48px 18px;min-height:100vh}
.wrap{max-width:680px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.5px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--g);box-shadow:0 0 16px var(--g)}
h1{font-size:34px;margin:18px 0 6px;line-height:1.15}
.sub{color:var(--muted);margin:0 0 28px;font-size:16px}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid #26263a;background:#101019;
color:#fff;font-size:15px;margin-bottom:18px;outline:none}
.search:focus{border-color:var(--g)}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid #22222f;
border-radius:16px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:#fff;
transition:.15s}
.card:hover{border-color:var(--g);transform:translateY(-2px)}
.ic{font-size:26px}
.tx{flex:1} .t{font-weight:700;font-size:17px} .d{color:var(--muted);font-size:13px;margin-top:2px}
.go{color:var(--g);font-size:22px;font-weight:700}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:13px;margin-top:34px;text-align:center}
footer a{color:var(--g);text-decoration:none}
</style></head><body><div class="wrap">
  <div class="brand"><span class="dot"></span> SİTİVLE</div>
  <h1>Video Rehberleri</h1>
  <p class="sub">Videolarda anlatılan araç ve haberlerin detaylı, adım adım PDF'leri. İncele, indir, kullan.</p>
  <input class="search" id="q" placeholder="Ara… (örn: GPT, böcek)" oninput="flt()">
  <div id="list">
    <a class="card" href="pdf/hamambocegi.pdf">
      <div class="ic">📄</div>
      <div class="tx"><div class="t">Hamambocegi</div>
      <div class="d">05.07.2026 · PDF rehber</div></div>
      <div class="go">→</div></a>
  </div>
  <footer>● Sitivle · Teknoloji & Yapay Zeka · <a href="https://instagram.com/">Instagram</a></footer>
</div>
<script>
function flt(){var v=document.getElementById('q').value.toLowerCase();
document.querySelectorAll('.card').forEach(function(c){
c.style.display=c.innerText.toLowerCase().includes(v)?'flex':'none';});}
</script></body></html>
