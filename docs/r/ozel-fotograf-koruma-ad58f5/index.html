<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ozel Fotograf Koruma · Sitivle</title><style>
:root{--g:#00e676;--bg:#06060b;--card:#12121c;--muted:#9a9aac}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#f2f2f7;
min-height:100vh;display:flex;justify-content:center;padding:40px 18px 60px;overflow-x:hidden;
background:linear-gradient(-45deg,#06060b,#0c1b14,#06060b,#0a1410);background-size:400% 400%;
animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 24px rgba(0,230,118,.30)}50%{box-shadow:0 0 42px rgba(0,230,118,.55)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.wrap{width:100%;max-width:440px;text-align:center}
.wrap>*{animation:up .6s both}
.wrap>*:nth-child(2){animation-delay:.05s}.wrap>*:nth-child(3){animation-delay:.1s}
.wrap>*:nth-child(4){animation-delay:.15s}.wrap>*:nth-child(5){animation-delay:.2s}
.wrap>*:nth-child(6){animation-delay:.25s}.wrap>*:nth-child(7){animation-delay:.3s}
.pp{width:116px;height:116px;border-radius:50%;object-fit:cover;border:3px solid var(--g);
margin:0 auto 16px;display:block;animation:glow 3.5s ease-in-out infinite}
.handle{display:inline-block;font-weight:900;font-size:30px;letter-spacing:.5px;margin:4px 0 2px;
background:linear-gradient(90deg,#00e676,#69f0ae,#00e676);background-size:200% auto;
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200% center}}
h1{font-size:22px;margin:2px 0 6px;line-height:1.3;font-weight:700;color:#e9e9f2}
.sub{color:var(--muted);font-size:15px;margin-bottom:24px;line-height:1.55}
.btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
padding:15px;border-radius:16px;margin-bottom:12px;font-weight:700;font-size:16px;
text-decoration:none;color:#fff;border:1px solid #22222f;background:var(--card);
transition:transform .15s,box-shadow .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.btn:hover,.btn:active{transform:translateY(-2px) scale(1.01)}
.btn .lg{width:22px;height:22px;flex:none}
.btn.ig{background:linear-gradient(90deg,#833ab4,#e1306c,#fcb045);border:0}
.btn.tt{background:#0e0e12;border:1px solid #2a2a35}
.btn.yt{background:#ff0033;border:0}
.btn.yt:hover,.btn.ig:hover,.btn.tt:hover{filter:brightness(1.08)}
.btn.pdf{background:linear-gradient(90deg,#00e676,#00c853);color:#04120a;animation:pulse 2.2s ease-in-out infinite}
.tag{display:inline-block;background:#0f2318;color:var(--g);border:1px solid #1c3a2a;
padding:6px 14px;border-radius:20px;font-size:12.5px;margin-bottom:14px;font-weight:600}
.gate{background:#0d0d16;border:1px solid #24243a;border-radius:18px;padding:18px;margin-bottom:14px}
.gate p{color:#ffd54a;font-weight:600;font-size:14px;margin-bottom:12px}
.locked{color:var(--muted);font-size:13px;margin:6px 0 14px}
.foot{color:var(--muted);font-size:12px;margin-top:28px}
.foot a{color:var(--g);text-decoration:none}
@media(max-width:420px){h1{font-size:23px}.btn{font-size:15px;padding:14px}}
</style></head><body><div class="wrap">
